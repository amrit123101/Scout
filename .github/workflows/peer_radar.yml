name: Peer Radar Scraper

on:
  workflow_dispatch:
    inputs:
      info_hash:
        description: '40-char Hex Hash'
        required: true
      u_id:
        description: 'Unique ID matching HF'
        required: true
      hf_url:
        description: 'HF Space URL'
        required: true

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: python -m pip install requests libtorrent

      - name: Run Peer Scraper
        env:
          INFO_HASH: ${{ github.event.inputs.info_hash }}
          U_ID: ${{ github.event.inputs.u_id }}
          HF_URL: ${{ github.event.inputs.hf_url }}
        run: |
          cat << 'EOF' > scraper.py
import os, time, requests, libtorrent as lt

HF_BASE = os.environ.get("HF_URL").rstrip('/')
INFO_HASH = os.environ.get("INFO_HASH")
U_ID = os.environ.get("U_ID")

def scrape():
    print(f"📡 [SCOUT] Launching Modern Radar for ID: {U_ID}")
    print(f"🔍 [SCOUT] Target Hash: {INFO_HASH}")
    
    settings = {
        'listen_interfaces': '0.0.0.0:6881',
        'enable_dht': True,
        'dht_bootstrap_nodes': 'router.bittorrent.com:6881,router.utorrent.com:6881,dht.transmissionbt.com:6881'
    }
    ses = lt.session(settings)
    
    magnet = f"magnet:?xt=urn:btih:{INFO_HASH}"
    atp = lt.parse_magnet_uri(magnet)
    atp.save_path = './tmp'
    handle = ses.add_torrent(atp)

    sent_ips = set()
    print("🌐 [SCOUT] Crawling DHT network (Checking HF status every 30s)...")

    start_time = time.time()
    max_runtime = 3600 

    while (time.time() - start_time) < max_runtime:
        # 1. HEARTBEAT: CHECK IF MUSCLE IS STILL BUSY
        try:
            r = requests.get(f"{HF_BASE}/status/{U_ID}", timeout=10)
            status = r.json().get("status")
            if status == "completed":
                print(f"🏁 [SCOUT] Engine finished task. Exiting to save minutes.", flush=True)
                break
            elif status == "stalled":
                print(f"🛑 [SCOUT] Engine stalled for 10 minutes. Exiting Scout. Engine will keep trying.", flush=True)
                break
        except Exception as e:
            print(f"⚠️ [SCOUT] Status check failed: {e}", flush=True)

        # 2. SCAN & INJECT
        s = handle.status()
        ses_status = ses.status()
        peers = handle.get_peer_info()
        
        print(f"⏱️ [{(time.time() - start_time):.0f}s] DHT Nodes: {ses_status.dht_nodes} | Peers Found: {len(peers)}", flush=True)
        
        extracted = [{"ip": p.ip[0], "port": p.ip[1]} for p in peers if p.ip[0]]
        new_peers = [p for p in extracted if f"{p['ip']}:{p['port']}" not in sent_ips]
        
        if new_peers:
            print(f"🚀 [SCOUT] Found {len(new_peers)} new UDP peers! Injecting to Muscle...", flush=True)
            try:
                r = requests.post(f"{HF_BASE}/inject_peers", json={"id": U_ID, "peers": new_peers}, timeout=10)
                if r.status_code == 200:
                    for p in new_peers: sent_ips.add(f"{p['ip']}:{p['port']}")
                    print(f"✅ [SCOUT] Injection Successful (Code 200)", flush=True)
            except Exception as e:
                print(f"❌ [SCOUT] Injection Failed: {e}", flush=True)

        time.sleep(30)

if __name__ == "__main__":
    scrape()
EOF
          
          python scraper.py
