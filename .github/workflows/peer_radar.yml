name: Peer Radar Scraper

on:
  workflow_dispatch:
    inputs:
      info_hash:
        description: '40-char Hex Hash'
        required: true
      u_id:
        description: 'Unique ID matching HF'
        required: true
      hf_url:
        description: 'HF Space URL'
        required: true

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5 # Upgraded to v5 to fix Node.js warning
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: python -m pip install requests libtorrent

      - name: Run Peer Scraper
        env:
          INFO_HASH: ${{ github.event.inputs.info_hash }}
          U_ID: ${{ github.event.inputs.u_id }}
          HF_URL: ${{ github.event.inputs.hf_url }}
        run: |
          cat << 'EOF' > scraper.py
          import os, time, requests, libtorrent as lt

          HF_BASE = os.environ.get("HF_URL").rstrip('/')
          INFO_HASH = os.environ.get("INFO_HASH")
          U_ID = os.environ.get("U_ID")

          def scrape():
              print(f"📡 [SCOUT] Radar Active for {U_ID}")
              
              start_time = time.time()
              max_runtime = 3600 # 60 minute safety hard-timeout
              
              settings = {
                  'listen_interfaces': '0.0.0.0:6881',
                  'enable_dht': True,
                  'dht_bootstrap_nodes': 'router.bittorrent.com:6881,router.utorrent.com:6881'
              }
              ses = lt.session(settings)
              handle = ses.add_torrent(lt.parse_magnet_uri(f"magnet:?xt=urn:btih:{INFO_HASH}"))
              handle.save_path = './tmp'

              sent_ips = set()

              while (time.time() - start_time) < max_runtime:
                  # 1. HEARTBEAT: CHECK IF MUSCLE IS STILL BUSY
                  try:
                      r = requests.get(f"{HF_BASE}/status/{U_ID}", timeout=10)
                      if r.json().get("status") == "completed":
                          print(f"🏁 [SCOUT] Muscle finished task {U_ID}. Exiting to save minutes.")
                          break
                  except Exception as e:
                      print(f"⚠️ [SCOUT] Status check failed: {e}")

                  # 2. SCAN & INJECT
                  peers = handle.get_peer_info()
                  extracted = [{"ip": p.ip[0], "port": p.ip[1]} for p in peers if p.ip[0]]
                  new_peers = [p for p in extracted if f"{p['ip']}:{p['port']}" not in sent_ips]
                  
                  if new_peers:
                      try:
                          requests.post(f"{HF_BASE}/inject_peers", json={"id": U_ID, "peers": new_peers}, timeout=10)
                          for p in new_peers: sent_ips.add(f"{p['ip']}:{p['port']}")
                          print(f"🎯 [SCOUT] Injected {len(new_peers)} new peers.")
                      except: pass

                  time.sleep(30) # Efficient check interval

          if __name__ == "__main__":
              scrape()
          EOF
          
          python scraper.py
