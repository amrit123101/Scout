name: Peer Radar Scraper

on:
  workflow_dispatch:
    inputs:
      info_hash:
        description: '40-char Hex Hash'
        required: true
      u_id:
        description: 'Unique ID matching HF'
        required: true
      hf_url:
        description: 'HF Space URL'
        required: true

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: python -m pip install requests libtorrent

      - name: Run Peer Scraper
        env:
          INFO_HASH: ${{ github.event.inputs.info_hash }}
          U_ID: ${{ github.event.inputs.u_id }}
          HF_URL: ${{ github.event.inputs.hf_url }}
        run: |
          cat << 'EOF' > scraper.py
          import os, time, requests, libtorrent as lt

          HF_BASE = os.environ.get("HF_URL").rstrip('/')
          INFO_HASH = os.environ.get("INFO_HASH")
          U_ID = os.environ.get("U_ID")

          def scrape():
              print(f"📡 [SCOUT] Launching Modern Radar for ID: {U_ID}")
              print(f"🔍 [SCOUT] Target Hash: {INFO_HASH}")
              
              settings = {
                  'listen_interfaces': '0.0.0.0:6881',
                  'enable_dht': True,
                  'dht_bootstrap_nodes': 'router.bittorrent.com:6881,router.utorrent.com:6881,dht.transmissionbt.com:6881'
              }
              ses = lt.session(settings)
              
              magnet = f"magnet:?xt=urn:btih:{INFO_HASH}"
              atp = lt.parse_magnet_uri(magnet)
              atp.save_path = './tmp'
              handle = ses.add_torrent(atp)

              sent_ips = set()
              print("🌐 [SCOUT] Crawling DHT network (10 min mission)...")

              for i in range(60):
                  time.sleep(10)
                  s = handle.status()
                  peers = handle.get_peer_info()
                  
                  print(f"⏱️ [{i*10}s] DHT Nodes: {s.dht_nodes} | Peers Found: {len(peers)}", flush=True)
                  
                  extracted = [{"ip": p.ip[0], "port": p.ip[1]} for p in peers if p.ip[0]]
                  new_peers = [p for p in extracted if f"{p['ip']}:{p['port']}" not in sent_ips]
                  
                  if new_peers:
                      print(f"🚀 [SCOUT] Found {len(new_peers)} new UDP peers! Injecting to Muscle...", flush=True)
                      try:
                          r = requests.post(f"{HF_BASE}/inject_peers", json={"id": U_ID, "peers": new_peers}, timeout=10)
                          if r.status_code == 200:
                              for p in new_peers: sent_ips.add(f"{p['ip']}:{p['port']}")
                              print(f"✅ [SCOUT] Injection Successful (Code 200)")
                      except Exception as e:
                          print(f"❌ [SCOUT] Injection Failed: {e}")

          if __name__ == "__main__":
              scrape()
          EOF
          
          python scraper.py
