name: Peer Radar Scraper (Cluster Broadcaster)

on:
  workflow_dispatch:
    inputs:
      info_hash:
        description: '40-char Hex Hash'
        required: true
      u_id:
        description: 'Unique ID matching HF'
        required: true

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: python -m pip install requests libtorrent

      - name: Run Peer Scraper
        env:
          INFO_HASH: ${{ github.event.inputs.info_hash }}
          U_ID: ${{ github.event.inputs.u_id }}
        run: |
          cat << 'EOF' > scraper.py
          import os, time, requests, urllib.parse, libtorrent as lt

          # 🛰️ THE 3 ENGINE TARGETS (No more 3x pings, Scout handles them all)
          TARGETS = [
              "https://amri12310-sys-b-engine.hf.space",
              "https://amri12310-sys-c-engine.hf.space",
              "https://amri12310-sys-d-engine.hf.space"
          ]
          
          INFO_HASH = os.environ.get("INFO_HASH")
          U_ID = os.environ.get("U_ID")

          def scrape():
              print(f"📡 [SCOUT] Launching UDP-to-TCP Cluster Bridge for: {U_ID}")
              
              # 🚀 THE UDP BOMB: Hardcoded Fallbacks
              hardcoded_trackers = [
                  "udp://tracker.opentrackr.org:1337/announce",
                  "udp://open.stealth.si:80/announce",
                  "udp://tracker.torrent.eu.org:451/announce",
                  "udp://tracker.bittor.pw:1337/announce",
                  "udp://exodus.desync.com:6969/announce",
                  "udp://tracker.moeking.me:6969/announce"
              ]
              
              # ⚡ NEW: Fetch Ngosang's Live UDP List
              print(f"📡 [SCOUT] Fetching dynamic UDP tracker list...", flush=True)
              try:
                  r = requests.get("https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_all_udp.txt", timeout=5)
                  dynamic_trackers = [t for t in r.text.split('\n') if t.strip() and t.startswith('udp://')]
              except Exception as e:
                  print(f"⚠️ [SCOUT] Failed to fetch dynamic trackers: {e}")
                  dynamic_trackers = []

              # Combine, deduplicate, and format
              all_udp_trackers = list(set(hardcoded_trackers + dynamic_trackers))
              tr_str = "".join([f"&tr={urllib.parse.quote(t)}" for t in all_udp_trackers])
              print(f"🚀 [SCOUT] Armed with {len(all_udp_trackers)} total UDP trackers.", flush=True)
              
              settings = {
                  'listen_interfaces': '0.0.0.0:6881',
                  'enable_dht': True,
                  'dht_bootstrap_nodes': 'router.bittorrent.com:6881,router.utorrent.com:6881,dht.transmissionbt.com:6881',
                  'announce_to_all_trackers': True,
                  'announce_to_all_tiers': True,
                  # ⚡ UPGRADE: Massive limits and uTP to catch strict home users
                  'connections_limit': 2000,
                  'enable_outgoing_utp': True,
                  'enable_incoming_utp': True
              }
              
              ses = lt.session(settings)
              
              # AI Fix: Create temp folder to avoid Libtorrent save errors
              os.makedirs('./tmp', exist_ok=True)
              magnet = f"magnet:?xt=urn:btih:{INFO_HASH}{tr_str}"
              atp = lt.parse_magnet_uri(magnet)
              atp.save_path = './tmp'
              handle = ses.add_torrent(atp)

              # AI Fix: Let DHT Wake up
              print("⏳ [SCOUT] Warming up DHT routing tables for 30 seconds...", flush=True)
              time.sleep(30)

              sent_ips = set()
              batch_new_peers = [] # ⚡ UPGRADE: Holds peers captured during the 0.5s loop
              
              start_time = time.time()
              last_active_time = time.time() # Used for the 15-minute kill switch
              last_push_time = time.time() # ⚡ UPGRADE: Timer for the 10-second batch push

              while (time.time() - start_time) < 3600:
                  current_time = time.time()
                  
                  # ⚡ UPGRADE: Extract peers instantly into memory
                  peers = handle.get_peer_info()
                  for p in peers:
                      ip_port = f"{p.ip[0]}:{p.ip[1]}"
                      if ip_port not in sent_ips:
                          batch_new_peers.append({"ip": p.ip[0], "port": p.ip[1]})
                          sent_ips.add(ip_port)

                  # ⚡ UPGRADE: Only run HTTP checks/pushes once every 10 seconds
                  if (current_time - last_push_time) >= 10:
                  
                      # 1. 🛑 CLUSTER HEARTBEAT & 15-MIN KILL SWITCH
                      all_completed = True
                      any_active = False

                      for url in TARGETS:
                          try:
                              r = requests.get(f"{url}/status/{U_ID}", timeout=5)
                              status = r.json().get("status")
                              
                              if status != "finished":
                                  all_completed = False
                              
                              # If an engine is active, it resets the 15-min death timer
                              if status == "active":
                                  any_active = True
                          except: pass

                      if all_completed:
                          print("🏁 [SCOUT] All 3 Engines finished downloading. Shutting down Scout.")
                          break
                      
                      if any_active:
                          last_active_time = current_time # Reset death timer
                      else:
                          # If 15 minutes (900 seconds) pass with 0 engines active (stalled)
                          if (current_time - last_active_time) > 900:
                              print("💀 [SCOUT] 15-MINUTE KILL SWITCH ACTIVATED. Swarm is dead. Exiting to save Action minutes.")
                              break

                      # 2. 🌐 UDP/DHT DISCOVERY & INJECTION
                      if batch_new_peers:
                          print(f"🚀 [SCOUT] Found {len(batch_new_peers)} new UDP/DHT peers! Blasting to cluster...", flush=True)
                          for url in TARGETS:
                              try:
                                  requests.post(f"{url}/inject_peers", json={"id": U_ID, "peers": batch_new_peers}, timeout=5)
                              except: pass
                          batch_new_peers.clear() # Clear the batch after sending
                      
                      ses_stat = ses.status()
                      print(f"⏱️ [{int(current_time-start_time)}s] DHT Nodes: {ses_stat.dht_nodes} | UDP Peers Bridged: {len(sent_ips)}", flush=True)
                      
                      last_push_time = current_time # Reset the batch timer

                  # ⚡ UPGRADE: The 0.5s local memory trap
                  time.sleep(0.5)

          if __name__ == "__main__":
              scrape()
          EOF
          python scraper.py
